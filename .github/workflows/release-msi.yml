name: Build and release installer

# Pushes to main and pull requests build, check and test only.
# A release is published when a v<version> tag is pushed (v0.1.4-beta, v1.0.0), or when the workflow is run by
# hand with a tag. A hand run builds the chosen branch and creates the tag on that commit if it does not exist.
# <version> must be exactly the version in Cargo.toml. A version with a -beta suffix is the beta channel and its
# release is a pre-release.
on:
  push:
    branches: [main]
    tags: ['v*.*.*-*', 'v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.4-beta. It must match the version in Cargo.toml. Leave blank to build and test without publishing.
        required: false
        type: string
      replace:
        description: Replace the files if the release already has them.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time per tag or branch. A release run is never cancelled part way.
concurrency:
  group: release-msi-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the build number in the app (aitrack --version) is the commit count
          fetch-depth: 0

      - name: Read the version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/release-info.ps1
          $release = Get-AiTrackRelease
          $tag = ''
          if ($env:REF_TYPE -eq 'tag') { $tag = $env:REF_NAME }
          elseif ($env:INPUT_TAG) { $tag = $env:INPUT_TAG.Trim() }
          $publish = $tag -ne ''
          if ($publish -and $tag -ne $release.Tag) {
            throw "Tag $tag does not match the version in Cargo.toml. Tag the commit as $($release.Tag), or change the version in Cargo.toml first."
          }
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "channel=$($release.Channel)" >> $env:GITHUB_OUTPUT
          Write-Output "Version $($release.Version) ($($release.Channel)), MSI version $($release.Msi). Publish: $publish."

      - name: Set up Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install the stable toolchain.' }
          rustup default stable-x86_64-pc-windows-msvc
          $line = (rustc --version)
          Write-Output $line
          if ($line -notmatch 'rustc (\d+)\.(\d+)') { throw "Could not read the Rust version from: $line" }
          if ([int]$Matches[1] -lt 1 -or ([int]$Matches[1] -eq 1 -and [int]$Matches[2] -lt 89)) {
            throw "Rust 1.89 or newer is needed (rust-version in Cargo.toml), found: $line"
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        env:
          AITRACK_NO_SPAWN: "1"  # tests never start real programs
        run: cargo test

      - name: Build the release exe
        run: cargo build --release

      - name: Check the release exe has no test hooks
        shell: pwsh
        run: |
          if (Select-String -Path target/release/aitrack.exe -Pattern 'test hooks' -SimpleMatch -Quiet) {
            throw 'aitrack.exe was built with the test-hooks feature.'
          }

      - name: Set up .NET (for WiX)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the MSI
        shell: pwsh
        run: ./scripts/installer.ps1

      - name: Make README.pdf (build-time only; not a separate download)
        shell: pwsh
        run: ./scripts/readme-pdf.ps1

      - name: Build the MSI in a zip
        shell: pwsh
        run: ./scripts/msi-zip.ps1

      - name: Build the portable zip
        shell: pwsh
        run: ./scripts/portable-zip.ps1

      - name: Keep the MSI
        uses: actions/upload-artifact@v7
        with:
          name: aiTrack-Setup-${{ steps.version.outputs.version }}-win-x64
          path: dist/aiTrack-Setup-${{ steps.version.outputs.version }}-win-x64.msi
          if-no-files-found: error

      - name: Keep the MSI in a zip
        uses: actions/upload-artifact@v7
        with:
          name: aiTrack-Setup-${{ steps.version.outputs.version }}-win-x64-msi
          path: dist/aiTrack-Setup-${{ steps.version.outputs.version }}-win-x64-msi.zip
          if-no-files-found: error

      - name: Keep the portable zip
        uses: actions/upload-artifact@v7
        with:
          name: aiTrack-${{ steps.version.outputs.version }}-win-x64
          path: dist/aiTrack-${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the MSI
        uses: actions/download-artifact@v8
        with:
          name: aiTrack-Setup-${{ needs.build.outputs.version }}-win-x64

      - name: Get the MSI in a zip
        uses: actions/download-artifact@v8
        with:
          name: aiTrack-Setup-${{ needs.build.outputs.version }}-win-x64-msi

      - name: Get the portable zip
        uses: actions/download-artifact@v8
        with:
          name: aiTrack-${{ needs.build.outputs.version }}-win-x64

      - name: Publish on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          REPLACE: ${{ inputs.replace || false }}
        run: |
          set -euo pipefail
          msi="aiTrack-Setup-${VERSION}-win-x64.msi"
          zip="aiTrack-${VERSION}-win-x64.zip"
          msizip="aiTrack-Setup-${VERSION}-win-x64-msi.zip"
          # the version already says "-beta"; the channel word is not appended to it
          title="aiTrack ${VERSION}"
          if [ "$CHANNEL" = "beta" ]; then kind="--prerelease"; first="${title} (pre-release)"; else kind="--latest"; first="${title}"; fi
          for f in "$msi" "$msizip" "$zip"; do
            test -s "$f" || { echo "::error::$f was not downloaded from the build."; exit 1; }
          done

          # the zip must hold the very same installer as the bare MSI
          inner=$(unzip -p "$msizip" "$msi" | sha256sum | cut -d' ' -f1)
          outer=$(sha256sum "$msi" | cut -d' ' -f1)
          if [ "$inner" != "$outer" ]; then
            echo "::error::$msizip does not hold the same installer as $msi."
            exit 1
          fi

          # The release notes carry the checksums, so a download can be checked.
          {
            echo "Windows 10/11, 64-bit. Download the MSI to install for all users, or the portable zip to run without installing."
            echo "If your browser blocks the .msi download, use the -msi.zip file (same installer)."
            echo "These builds are not code-signed yet, so Windows SmartScreen shows \"Unknown publisher\"."
            echo
            echo "Windows SHA256:"
            echo '```'
            sha256sum "$msi" "$msizip" "$zip"
            echo '```'
          } > win-notes.md

          # The tag has to point at the commit this run built.
          if commit=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null) && [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG points at $commit, but this run built $GITHUB_SHA."
            exit 1
          fi

          # The macOS workflow makes the same release. If it is not there yet, create it; if the other
          # workflow creates it first (create fails), fall through and add to it.
          if ! gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            { echo "${first}"; echo; echo "aiTrack is a small always-on-top window that shows how much of your Claude and Grok plan limits you have used."; echo; echo "Code signing policy: https://github.com/genen/aiTrack/blob/main/CODE-SIGNING-POLICY.md | Privacy statement: https://github.com/genen/aiTrack/blob/main/PRIVACY.md"; echo; cat win-notes.md; } > notes.md
            if gh release create "$TAG" "$msi" "$msizip" "$zip" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md "$kind"; then
              exit 0
            fi
            echo "Release creation failed, probably the macOS run created it first. Adding to it."
            gh release view "$TAG" --json tagName > /dev/null
          fi

          # The release exists: never overwrite a file unless the run asked for it.
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in "$msi" "$msizip" "$zip"; do
            if printf '%s\n' "$existing" | grep -Fxq "$f"; then
              if [ "$REPLACE" != "true" ]; then
                echo "::error::$TAG already has $f. Run the workflow by hand with Replace checked to overwrite it."
                exit 1
              fi
            fi
          done
          gh release upload "$TAG" "$msi" "$msizip" "$zip" --clobber

          # Add the Windows notes to the existing text, once (marker: "Windows SHA256:"), keeping whatever
          # the macOS run wrote. A rerun leaves the text alone.
          # The three release workflows edit the same text (read, append, write), so an edit can
          # overwrite a section another run added in between. Re-read after each write and add the
          # section again until it is there (a concurrency group cannot do this: it keeps only one
          # waiting run per group, and there are three workflows).
          marker="Windows SHA256:"
          hashes=$(grep -E '^[0-9a-f]{64} ' win-notes.md)
          # True when the notes hold this section with exactly the checksums of this run's files.
          section_current() {
            local text
            text=$(printf '%s\n' "$1" | tr -d '\r')
            printf '%s\n' "$text" | grep -Fq "$marker" || return 1
            while IFS= read -r line; do
              printf '%s\n' "$text" | grep -Fxq -- "$line" || return 1
            done <<< "$hashes"
          }
          add_section() {
            for attempt in 1 2 3 4 5 6; do
              body=$(gh release view "$TAG" --json body --jq .body)
              if section_current "$body"; then
                return 0
              fi
              # A section from an earlier run of this workflow (Replace) is cut out, from its marker line
              # to the closing code fence, so the new checksums take its place.
              body=$(printf '%s\n' "$body" | awk -v m="$marker" 'skip == 0 && index($0, m) == 1 { skip = 1; fence = 0; next } skip == 1 { if ($0 ~ /^```/) { fence++; if (fence == 2) skip = 0 }; next } { print }')
              { printf '%s\n\n' "$body"; cat win-notes.md; } > notes.md
              gh release edit "$TAG" --notes-file notes.md --title "$title"
              sleep $((2 + RANDOM % 4))
            done
            return 1
          }
          add_section || true
          # A slower run of another workflow may have read the text before our edit and written it back
          # after our last check. Look once more after a pause and repair it if so. A writer slower than
          # this pause can still win; rerunning the workflow with Replace checked repairs the notes.
          sleep 10
          add_section || true
          if ! section_current "$(gh release view "$TAG" --json body --jq .body)"; then
            echo "::error::The Windows SHA256: section is missing from the release notes of $TAG."
            exit 1
          fi
          gh release edit "$TAG" --title "$title"
